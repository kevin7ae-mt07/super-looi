name: iOS unsigned build

# Builds an unsigned Super LOOI.ipa on a GitHub macOS runner so it can be
# signed and installed from Windows with a sideloading tool (e.g. Sideloadly).
on:
  workflow_dispatch:
    inputs:
      voice:
        description: "Live voice backend baked into the app"
        type: choice
        default: own-server
        options:
          - own-server   # VOICE_* repo secrets (your realtime server)
          - xai          # xAI Grok voice: wss://api.x.ai/v1/realtime, grok-voice-latest
          - openai       # api.openai.com realtime
  push:
    branches: [main]
    paths:
      - ".github/workflows/ios-unsigned.yml"

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate
          pnpm --version

      - name: Install iSH (Linux shell) build tools
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          brew install meson ninja lld llvm libarchive
          which meson ninja
          ls /opt/homebrew/opt/lld/bin/ld.lld /opt/homebrew/opt/llvm/bin/clang /opt/homebrew/opt/libarchive/lib/libarchive.dylib

      - name: Show toolchain
        run: |
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim aarch64-apple-darwin
          xcodebuild -version
          rustup --version
          cargo --version

      - name: Cache NSH, sherpa-onnx and cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/super-looi
            ~/.cargo/registry
            ~/.cargo/git
          key: ios-${{ runner.os }}-${{ hashFiles('apps/nsh/scripts/nsh.ts', 'apps/nsh/scripts/prepare-*.mjs') }}
          restore-keys: ios-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check app runtime (informational)
        continue-on-error: true
        run: |
          pnpm --filter "./packages/*" run build
          cd apps/nsh && node_modules/.bin/tsc -p tsconfig.runtime.json --noEmit

      - name: Package unsigned iOS app
        working-directory: apps/nsh
        env:
          VOICE_CHOICE: ${{ inputs.voice || 'own-server' }}
          # Your own realtime server, kept in repo secrets.
          SECRET_VOICE_PROVIDER: ${{ secrets.VOICE_PROVIDER }}
          SECRET_VOICE_BASE_URL: ${{ secrets.VOICE_BASE_URL }}
          SECRET_VOICE_MODEL: ${{ secrets.VOICE_MODEL }}
        run: |
          case "$VOICE_CHOICE" in
            xai)
              export VOICE_PROVIDER=openai VOICE_BASE_URL=wss://api.x.ai/v1/realtime VOICE_MODEL=grok-voice-latest ;;
            openai)
              export VOICE_PROVIDER=openai VOICE_BASE_URL= VOICE_MODEL= ;;
            *)
              export VOICE_PROVIDER="$SECRET_VOICE_PROVIDER" VOICE_BASE_URL="$SECRET_VOICE_BASE_URL" VOICE_MODEL="$SECRET_VOICE_MODEL" ;;
          esac
          echo "Voice backend: $VOICE_CHOICE (custom URL: $([ -n "$VOICE_BASE_URL" ] && echo yes || echo no))"
          node --import tsx scripts/nsh.ts package --target ios

      - name: Check iOS permission descriptions
        working-directory: apps/nsh/.nsh/out
        run: |
          PLIST="$(ls -d *.app | head -1)/Info.plist"
          for key in NSBluetoothAlwaysUsageDescription NSMicrophoneUsageDescription NSCameraUsageDescription; do
            /usr/libexec/PlistBuddy -c "Print :$key" "$PLIST" || { echo "Missing $key"; exit 1; }
          done

      - name: Make .ipa
        working-directory: apps/nsh/.nsh/out
        run: |
          ls -la
          APP="$(ls -d *.app | head -1)"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry ../../../../SuperLOOI-unsigned.ipa Payload
          ls -la ../../../../SuperLOOI-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: SuperLOOI-unsigned-ipa-${{ inputs.voice || 'own-server' }}
          path: SuperLOOI-unsigned.ipa
          retention-days: 30
